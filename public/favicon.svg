<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Gradient background with rounded square (squircle) -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Calendar Base -->
  <rect x="14" y="18" width="36" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.96" />
  
  <!-- Calendar Header Bar -->
  <path d="M14 24C14 20.6863 16.6863 18 20 18H44C47.3137 18 50 20.6863 50 24V27H14V24Z" fill="url(#accentGrad)" />

  <!-- Calendar Pins -->
  <rect x="22" y="14" width="4" height="7" rx="2" fill="#E2E8F0" />
  <rect x="38" y="14" width="4" height="7" rx="2" fill="#E2E8F0" />

  <!-- Circular Badge with dynamic checkmark / 'A' motif -->
  <circle cx="37" cy="37" r="11" fill="url(#checkGrad)" />
  <path d="M32 37L35.5 40.5L42 33.5" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Mini schedule dot in calendar grid -->
  <circle cx="23" cy="33" r="2.2" fill="#94A3B8" />
  <circle cx="23" cy="40" r="2.2" fill="#94A3B8" />
</svg>
